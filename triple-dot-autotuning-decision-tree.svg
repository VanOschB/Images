<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">Triple-dot charge-sensor autotuning decision tree</title>
  <desc id="desc">Four-stage decision tree covering bootstrapping, global dot characterization, virtual gating, and charge state characterization, with green pass paths and red dashed failure paths.</desc>
  <defs>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef5ff"/><stop offset="1" stop-color="#fafcff"/></linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef9ef"/><stop offset="1" stop-color="#fbfefb"/></linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8e8"/><stop offset="1" stop-color="#fffdf8"/></linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3eefb"/><stop offset="1" stop-color="#fcfaff"/></linearGradient>
    <linearGradient id="acceptCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf9ef"/><stop offset="1" stop-color="#f8fdf9"/></linearGradient>
    <linearGradient id="rejectCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0f0"/><stop offset="1" stop-color="#fff9f9"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.15"/></filter>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#111827"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#249245"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ef2b2d"/></marker>
    <style>
      .font { font-family: Inter, Arial, Helvetica, sans-serif; fill: #101828; }
      .stage-title { font: 700 25px Inter, Arial, sans-serif; }
      .stage-sub { font: 400 15px Inter, Arial, sans-serif; fill: #475467; }
      .process { font: 700 21px Inter, Arial, sans-serif; }
      .decision { font: 500 19px Inter, Arial, sans-serif; }
      .route { font: 700 20px Inter, Arial, sans-serif; }
      .endpoint { font: 700 23px Inter, Arial, sans-serif; }
      .stage-card { stroke-width: 2; rx: 10; filter: url(#shadow); }
      .process-card { stroke-width: 2; rx: 10; filter: url(#shadow); }
      .flow { fill: none; stroke: #111827; stroke-width: 2.5; marker-end: url(#arrowBlack); }
      .pass { fill: none; stroke: #249245; stroke-width: 2.8; marker-end: url(#arrowGreen); }
      .fail { fill: none; stroke: #ef2b2d; stroke-width: 2.7; stroke-dasharray: 10 9; marker-end: url(#arrowRed); }
    </style>
  </defs>
  <rect width="1600" height="1320" fill="#ffffff"/>

  <rect class="stage-card" x="85" y="170" width="385" height="130" fill="url(#blueCard)" stroke="#316db7"/>
  <circle cx="90" cy="170" r="26" fill="#316db7"/>
  <text class="font" x="90" y="179" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">1</text>
  <g transform="translate(122 203)" fill="#316db7">
    <path d="M32 0h14l3 12a38 38 0 0 1 8 4l11-6 10 10-6 11a38 38 0 0 1 4 8l12 3v14l-12 3a38 38 0 0 1-4 8l6 11-10 10-11-6a38 38 0 0 1-8 4l-3 12H32l-3-12a38 38 0 0 1-8-4l-11 6L0 78l6-11a38 38 0 0 1-4-8l-12-3V42l12-3a38 38 0 0 1 4-8L0 20 10 10l11 6a38 38 0 0 1 8-4z" transform="scale(.65)"/>
    <circle cx="25" cy="32" r="10" fill="#ffffff"/>
  </g>
  <text class="font stage-title" x="205" y="220">Bootstrapping</text>
  <text class="font stage-sub" x="205" y="246">Establish a functional device</text>
  <path d="M470 235 H505 M505 108 H530 M505 108 V405 M505 252 H530 M505 405 H530" fill="none" stroke="#111827" stroke-width="2.5"/>
  <path class="flow" d="M470 235 H500"/>
  <rect class="process-card" x="530" y="58" width="285" height="100" fill="url(#blueCard)" stroke="#316db7"/>
  <text class="font process" x="672.5" y="99" text-anchor="middle">Noise Floor</text>
  <text class="font process" x="672.5" y="127" text-anchor="middle">&amp; Turn-On</text>
  <rect class="process-card" x="530" y="202" width="285" height="100" fill="url(#blueCard)" stroke="#316db7"/>
  <text class="font process" x="672.5" y="243" text-anchor="middle">Finger-Gate</text>
  <text class="font process" x="672.5" y="271" text-anchor="middle">Pinch-Offs</text>
  <rect class="process-card" x="530" y="355" width="285" height="100" fill="url(#blueCard)" stroke="#316db7"/>
  <text class="font process" x="672.5" y="396" text-anchor="middle">Barrier &amp; Sensor</text>
  <text class="font process" x="672.5" y="424" text-anchor="middle">Working Points</text>
  <path class="flow" d="M815 108 H835"/><path class="flow" d="M815 252 H835"/><path class="flow" d="M815 405 H835"/>
  <polygon points="835,108 1035,48 1235,108 1035,168" fill="url(#blueCard)" stroke="#316db7" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="font decision" x="1035" y="102" text-anchor="middle">Both channels</text><text class="font decision" x="1035" y="128" text-anchor="middle">turn on?</text>
  <polygon points="835,252 1035,192 1235,252 1035,312" fill="url(#blueCard)" stroke="#316db7" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="font decision" x="1035" y="237" text-anchor="middle">All pinch-off windows</text><text class="font decision" x="1035" y="263" text-anchor="middle">and fits valid?</text>
  <polygon points="835,405 1035,345 1235,405 1035,465" fill="url(#blueCard)" stroke="#316db7" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="font decision" x="1035" y="390" text-anchor="middle">Working and sensing</text><text class="font decision" x="1035" y="416" text-anchor="middle">points found?</text>
  <path class="pass" d="M1035 168 V190"/><text class="route" x="1072" y="187" fill="#249245">Pass</text>
  <path class="pass" d="M1035 312 V343"/><text class="route" x="1072" y="338" fill="#249245">Pass</text>

  <rect class="stage-card" x="85" y="525" width="385" height="130" fill="url(#greenCard)" stroke="#289548"/>
  <circle cx="90" cy="525" r="26" fill="#289548"/><text class="font" x="90" y="534" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">2</text>
  <g transform="translate(125 553)" fill="none" stroke="#289548" stroke-width="5"><circle cx="34" cy="34" r="24"/><circle cx="34" cy="34" r="11"/><path d="M34 0v16M34 52v16M0 34h16M52 34h16"/></g>
  <text class="font stage-title" x="205" y="568">Global Dot</text><text class="font stage-title" x="205" y="598">Characterization</text>
  <text class="font stage-sub" x="205" y="625">Calibrate sensor and map CSDs</text><path class="flow" d="M470 590 H835"/>
  <polygon points="835,590 1035,530 1235,590 1035,650" fill="url(#greenCard)" stroke="#289548" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="font decision" x="1035" y="575" text-anchor="middle">Countersweeps calibrated</text><text class="font decision" x="1035" y="601" text-anchor="middle">and CSDs acquired?</text>
  <path class="pass" d="M1035 465 V528"/><text class="route" x="1072" y="505" fill="#249245">Pass</text>

  <rect class="stage-card" x="85" y="725" width="385" height="130" fill="url(#amberCard)" stroke="#dda62d"/>
  <circle cx="90" cy="725" r="26" fill="#dda62d"/><text class="font" x="90" y="734" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">3</text>
  <g transform="translate(125 756)" fill="none" stroke="#d49b22" stroke-width="5" stroke-linecap="round"><path d="M0 14h68M0 34h68M0 54h68"/><circle cx="22" cy="14" r="6" fill="#ffffff"/><circle cx="47" cy="34" r="6" fill="#ffffff"/><circle cx="30" cy="54" r="6" fill="#ffffff"/></g>
  <text class="font stage-title" x="205" y="779">Virtual Gating</text><text class="font stage-sub" x="205" y="807">Build the physical-to-virtual map</text><path class="flow" d="M470 790 H835"/>
  <polygon points="835,790 1035,730 1235,790 1035,850" fill="url(#amberCard)" stroke="#dda62d" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="font decision" x="1035" y="775" text-anchor="middle">Lever-arm matrix</text><text class="font decision" x="1035" y="801" text-anchor="middle">established?</text>
  <path class="pass" d="M1035 650 V728"/><text class="route" x="1072" y="697" fill="#249245">Pass</text>

  <rect class="stage-card" x="85" y="925" width="385" height="130" fill="url(#purpleCard)" stroke="#8469ae"/>
  <circle cx="90" cy="925" r="26" fill="#8469ae"/><text class="font" x="90" y="934" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">4</text>
  <g transform="translate(124 957)" fill="#8469ae"><rect x="1" y="1" width="21" height="21" transform="rotate(45 11.5 11.5)"/><rect x="31" y="1" width="21" height="21" transform="rotate(45 41.5 11.5)"/><rect x="1" y="31" width="21" height="21" transform="rotate(45 11.5 41.5)"/><rect x="31" y="31" width="21" height="21" transform="rotate(45 41.5 41.5)"/></g>
  <text class="font stage-title" x="205" y="965">Charge State</text><text class="font stage-title" x="205" y="995">Characterization</text><text class="font stage-sub" x="205" y="1022">Identify and label occupations</text><path class="flow" d="M470 990 H835"/>
  <polygon points="835,990 1035,930 1235,990 1035,1050" fill="url(#purpleCard)" stroke="#8469ae" stroke-width="2.2" filter="url(#shadow)"/>
  <text class="font decision" x="1035" y="975" text-anchor="middle">Charge states identified</text><text class="font decision" x="1035" y="1001" text-anchor="middle">and labeled?</text>
  <path class="pass" d="M1035 850 V928"/><text class="route" x="1072" y="897" fill="#249245">Pass</text>

  <path class="fail" d="M1235 108 H1470"/><path class="fail" d="M1235 252 H1470"/><path class="fail" d="M1235 405 H1470"/><path class="fail" d="M1235 590 H1470"/><path class="fail" d="M1235 790 H1470"/><path class="fail" d="M1235 990 H1470"/><path class="fail" d="M1470 108 V1132"/>
  <text class="route" x="1325" y="92" fill="#ef2b2d">Fail</text><text class="route" x="1325" y="236" fill="#ef2b2d">Fail</text><text class="route" x="1325" y="389" fill="#ef2b2d">Fail</text><text class="route" x="1325" y="574" fill="#ef2b2d">Fail</text><text class="route" x="1325" y="774" fill="#ef2b2d">Fail</text><text class="route" x="1325" y="974" fill="#ef2b2d">Fail</text>
  <path class="pass" d="M1035 1050 V1132"/><text class="route" x="1072" y="1102" fill="#249245">Pass</text>
  <rect x="825" y="1140" width="410" height="105" rx="10" fill="url(#acceptCard)" stroke="#289548" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="880" cy="1192.5" r="30" fill="#289548"/><path d="M865 1193 l10 10 21-25" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="font endpoint" x="930" y="1185">Device Accepted</text><text class="font endpoint" x="930" y="1215">Protocol Complete</text>
  <rect x="1285" y="1140" width="285" height="105" rx="10" fill="url(#rejectCard)" stroke="#ef2b2d" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1335" cy="1192.5" r="30" fill="#ef2b2d"/><path d="M1323 1181 l24 24 M1347 1181 l-24 24" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text class="font endpoint" x="1380" y="1185">Protocol Halted</text><text class="font" x="1380" y="1215" font-size="18" font-weight="700">Reject or Retune</text>
</svg>
