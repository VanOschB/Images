<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Silicon MOS heterostructure without an electron wavefunction</title>
  <desc id="desc">A minimal layered silicon MOS device with patterned second-layer gates, a continuous inset first-layer gate surrounded at both ends by aluminium oxide, silicon dioxide, and an empty silicon layer. No electron wavefunction or voltage-potential graphic is shown.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a86a00"/>
      <stop offset="0.32" stop-color="#f5bd20"/>
      <stop offset="0.55" stop-color="#ffe57a"/>
      <stop offset="0.8" stop-color="#d99500"/>
      <stop offset="1" stop-color="#8c5700"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17468f"/>
      <stop offset="0.45" stop-color="#4d89e4"/>
      <stop offset="0.72" stop-color="#2867c3"/>
      <stop offset="1" stop-color="#123b7a"/>
    </linearGradient>
    <linearGradient id="alumina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeecb"/>
      <stop offset="1" stop-color="#a9cf86"/>
    </linearGradient>
    <linearGradient id="oxide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a078cb"/>
      <stop offset="0.5" stop-color="#d6baf0"/>
      <stop offset="1" stop-color="#9971c5"/>
    </linearGradient>
    <linearGradient id="silicon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd3d7"/>
      <stop offset="1" stop-color="#9ca3a9"/>
    </linearGradient>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 4H14M3 10H12" stroke="#fff" stroke-opacity="0.1"/>
    </pattern>
    <clipPath id="stack">
      <rect x="42" y="42" width="1116" height="816" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="#f6f8fa"/>

  <g clip-path="url(#stack)">
    <!-- Continuous supporting layers; silicon is deliberately left empty. -->
    <rect x="45" y="540" width="1110" height="315" fill="url(#silicon)"/>
    <rect x="45" y="420" width="1110" height="120" fill="url(#oxide)"/>
    <rect x="45" y="250" width="1110" height="170" fill="url(#alumina)"/>

    <!-- One continuous inset first-layer gate; Al2O3 fills both side gaps. -->
    <rect x="105" y="338" width="990" height="82" fill="url(#blue)" stroke="#0c2e63" stroke-width="3"/>

    <!-- Patterned second-layer gates, all flush on Al2O3. -->
    <g stroke="#583800" stroke-width="3" stroke-linejoin="round">
      <path d="M65 125Q65 113 77 113H397Q409 113 409 125V250H65Z" fill="url(#gold)"/>
      <path d="M465 62Q465 50 477 50H723Q735 50 735 62V250H465Z" fill="url(#gold)"/>
      <path d="M791 125Q791 113 803 113H1123Q1135 113 1135 125V250H791Z" fill="url(#gold)"/>
    </g>
    <g fill="url(#grain)" pointer-events="none">
      <path d="M65 125Q65 113 77 113H397Q409 113 409 125V250H65Z"/>
      <path d="M465 62Q465 50 477 50H723Q735 50 735 62V250H465Z"/>
      <path d="M791 125Q791 113 803 113H1123Q1135 113 1135 125V250H791Z"/>
    </g>
  </g>

  <!-- Interfaces and border -->
  <line x1="45" y1="250" x2="1155" y2="250" stroke="#67844d" stroke-width="3"/>
  <line x1="45" y1="420" x2="1155" y2="420" stroke="#38205b" stroke-width="3"/>
  <line x1="45" y1="540" x2="1155" y2="540" stroke="#40344e" stroke-width="3"/>
  <rect x="42" y="42" width="1116" height="816" rx="8" fill="none" stroke="#141a20" stroke-width="5"/>

  <!-- Only layer names are rendered as text. -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="600" y="165" text-anchor="middle" font-size="27" fill="#241700">Metal Gate Layer 2</text>
    <text x="82" y="295" font-size="28" fill="#2b491e">Al<tspan baseline-shift="sub" font-size="18">2</tspan>O<tspan baseline-shift="sub" font-size="18">3</tspan></text>
    <text x="600" y="385" text-anchor="middle" font-size="23" fill="#f5f9ff">Metal Gate Layer 1</text>
    <text x="82" y="490" font-size="29" fill="#2f184c">SiO<tspan baseline-shift="sub" font-size="19">2</tspan></text>
    <text x="82" y="810" font-size="31" fill="#273039">Si</text>
  </g>
</svg>
